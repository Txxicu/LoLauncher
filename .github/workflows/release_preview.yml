name: Generate Release GIF Preview

on:
  release:
    types: [published]
  workflow_dispatch: # Позволяет запускать вручную из ветки main!

jobs:
  build-and-record-gif:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем исходный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Даём права на запуск gradlew (если файл существует в проекте)
      - name: Grant execute permission for gradlew
        run: test -f gradlew && chmod +x gradlew || true

      # 4. Устанавливаем виртуальный монитор (Xvfb), ffmpeg для GIF и xdotool
      - name: Install Display & Recording Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xdotool libxrender1 libxtst6 libxi6

      # 5. Запускаем лаунчер в виртуальном экране и записываем GIF
      - name: Launch App and Record GIF
        run: |
          # Создаём виртуальный экран с разрешением 1280x800
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          
          # Запускаем Compose Desktop лаунчер через ./gradlew или системный gradle
          if [ -f "./gradlew" ]; then
            ./gradlew run &
          else
            gradle run &
          fi
          
          # Ждём 10 секунд для завершения сборки и запуска окна лаунчера
          sleep 10

          # Запускаем запись экрана в GIF (10 секунд видео)
          ffmpeg -f x11grab -video_size 1280x800 -i :99 -t 10 -vf "fps=12,scale=800:-1:flags=lanczos" -loop 0 release_preview.gif &
          
          # Эмулируем клики и движения мыши по центру экрана
          sleep 2
          xdotool mousemove 640 400 click 1
          sleep 2
          xdotool mousemove 500 300
          sleep 4

          # Ждём завершения сохранения GIF
          wait

      # 6. Сохраняем GIF как артефакт
      - name: Upload GIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-gif
          path: release_preview.gif

      # 7. Загружаем GIF в релиз (при создании нового релиза)
      - name: Attach GIF to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: release_preview.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
